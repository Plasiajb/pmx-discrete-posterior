name: package-ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and release tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[scipy,plots,test]"
          python -m pip install build twine

      - name: Compile package and examples on Python 3.12
        if: matrix.python-version == '3.12'
        run: python -m compileall -q src tests examples

      - name: Compile package and compatible examples on older Python
        if: matrix.python-version != '3.12'
        # The frozen manuscript demos require Python 3.12; their source hashes are preserved.
        run: python -m compileall -q -x '[/\\]manuscript_demos[/\\]' src tests examples

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build source distribution and wheel
        run: python -m build --sdist --wheel

      - name: Check package metadata
        run: python -m twine check dist/*
