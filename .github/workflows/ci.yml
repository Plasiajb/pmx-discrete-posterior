name: package-ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONIOENCODING: utf-8
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        shell: pwsh
        run: |
          python -m pip install "build>=1.2,<2" "twine>=6,<7"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m build --wheel --sdist --outdir .github/_ci/dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m twine check .github/_ci/dist/*
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: .github/_ci/dist/*
          if-no-files-found: error
          retention-days: 14

  portable:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        environment:
          - python: "3.11"
            dependencies: minimum
          - python: "3.12"
            dependencies: current
        distribution: [wheel, sdist]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.environment.python }}
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: .github/_ci/dist
      - name: Clean-installed portable suite and real OXC example
        shell: pwsh
        run: |
          ./.github/scripts/test-installed.ps1 -Distribution ${{ matrix.distribution }} -Dependencies ${{ matrix.environment.dependencies }} -Selection quick -Reference OXC
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portable-${{ matrix.environment.python }}-${{ matrix.distribution }}
          path: .github/_ci/*-quick/results/*
          if-no-files-found: warn
          retention-days: 14

  tac-reference:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        environment:
          - python: "3.11"
            dependencies: minimum
          - python: "3.12"
            dependencies: current
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.environment.python }}
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: .github/_ci/dist
      - name: Clean-installed TAC Laplace and curvature regressions
        shell: pwsh
        run: |
          ./.github/scripts/test-installed.ps1 -Distribution wheel -Dependencies ${{ matrix.environment.dependencies }} -Selection slow -Reference TAC
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tac-${{ matrix.environment.python }}
          path: .github/_ci/wheel-*-slow/results/*
          if-no-files-found: warn
          retention-days: 14

  linux-installed:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        environment:
          - python: "3.11"
            dependencies: minimum
          - python: "3.12"
            dependencies: current
        distribution: [wheel, sdist]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.environment.python }}
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: .github/_ci/dist
      - name: Clean-installed Linux quick suite and real OXC example
        shell: bash
        run: >-
          python -B .github/scripts/test_installed.py
          --distribution ${{ matrix.distribution }}
          --dependencies ${{ matrix.environment.dependencies }}
          --selection quick --reference OXC
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-installed-${{ matrix.environment.python }}-${{ matrix.distribution }}
          path: .github/_ci/*-quick/results/*
          if-no-files-found: warn
          retention-days: 14
