[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pmx-discrete-posterior"
version = "0.1.2"
description = "Laplace posterior probabilities for predefined discrete states in pharmacometric models"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  {name = "AI-ready PMX benchmark engine contributors"}
]
keywords = [
  "pharmacometrics",
  "laplace-approximation",
  "posterior-probability",
  "adherence",
  "therapeutic-drug-monitoring"
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Medical Science Apps."
]
dependencies = [
  "numpy>=1.23"
]

[project.urls]
Homepage = "https://github.com/Plasiajb/pmx-discrete-posterior"
Repository = "https://github.com/Plasiajb/pmx-discrete-posterior"

[project.optional-dependencies]
scipy = ["scipy>=1.9"]
plots = ["matplotlib>=3.7"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
