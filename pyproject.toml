[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "pmx-discrete-posterior"
version = "0.2.1.dev20261021"
description = "Model-based posterior probabilities for discrete pharmacometric states"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "AI-ready PMX benchmark engine contributors"}
]
keywords = [
  "pharmacometrics",
  "laplace-approximation",
  "posterior-probability",
  "adherence",
  "therapeutic-drug-monitoring"
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Medical Science Apps."
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.16.2,<2"
]

[project.urls]
Homepage = "https://github.com/Plasiajb/pmx-discrete-posterior"
Repository = "https://github.com/Plasiajb/pmx-discrete-posterior"

[project.optional-dependencies]
test = ["pytest>=8", "mpmath>=1.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = ["slow: full TAC reference calculations"]
